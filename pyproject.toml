[project]
name = "trade-ai"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
authors = [
    { name = "Abhimanyu6676", email = "iamlive24@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "openalgo>=2.0.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
trade-ai = "trade_ai:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jurigged>=0.6.1",
]
